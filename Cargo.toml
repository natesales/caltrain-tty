[package]
name = "caltrain-tty"
version = "0.1.0"
edition = "2021"
description = "Redwood City Caltrain departures, printed like a glass teletype"
license = "MIT"

[[bin]]
name = "caltrain-tty"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
csv = "1.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "gzip", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
